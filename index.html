<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kua Merah - Casino Edition</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #072210; color: white; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; touch-action: manipulation; }
    
    .splash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #05160a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: opacity 0.8s ease; }
    .splash-title { font-size: 38px; font-weight: 900; color: #fbc02d; text-shadow: 0 0 15px rgba(251, 192, 45, 0.6); letter-spacing: 2px; }
    .splash-cards { display: flex; gap: 10px; margin: 25px 0; }
    .splash-card { width: 50px; height: 75px; background: white; border-radius: 6px; font-weight: bold; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255,255,255,0.4); animation: shuffle 1.2s infinite alternate ease-in-out; }
    .splash-card.red { color: #d32f2f; }
    @keyframes shuffle { 0% { transform: translateY(0) rotate(-5deg); } 100% { transform: translateY(-15px) rotate(5deg); } }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-box { background: #11361c; border: 2px solid #fbc02d; padding: 25px; border-radius: 14px; max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
    .modal-box h2 { color: #fbc02d; margin-top: 0; }

    .name-input { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #fbc02d; background: #072210; color: white; font-size: 16px; font-weight: bold; text-align: center; margin-bottom: 15px; }
    .name-input:focus { outline: none; border-color: #ffd54f; }

    .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .tier-btn { background: rgba(255,255,255,0.1); border: 2px solid #fbc02d; color: white; padding: 12px 5px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tier-btn.selected { background: #fbc02d; color: #111; }

    .casino-table { background: radial-gradient(circle, #124d26 0%, #082913 100%); border: 8px solid #3e2723; border-radius: 20px; padding: 15px; max-width: 900px; margin: 0 auto; box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 5px 20px rgba(0,0,0,0.7); }
    .table-layout { display: grid; grid-template-rows: auto auto auto; gap: 12px; position: relative; }
    .bot-hand { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-height: 95px; }
    .balance { font-size: 13px; font-weight: bold; color: #fbc02d; margin-top: 2px; }

    .action-banner { background: #fbc02d; color: #111; font-weight: bold; padding: 6px 14px; border-radius: 20px; display: inline-block; margin: 8px 0; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

    .poker-card {
      display: inline-block;
      width: 46px;
      height: 68px;
      background: white;
      color: #111;
      border-radius: 5px;
      margin: 2px;
      position: relative;
      font-weight: bold;
      box-shadow: 1px 2px 5px rgba(0,0,0,0.5);
      user-select: none;
      vertical-align: middle;
      border: 1px solid #ccc;
      transition: transform 0.2s ease;
    }
    .poker-card.red { color: #d32f2f; }
    .poker-card .rank-top { position: absolute; top: 2px; left: 4px; font-size: 11px; line-height: 10px; text-align: left; }
    .poker-card .rank-top span { display: block; font-size: 9px; }
    .poker-card .center-suit { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; }
    
    .poker-card.back {
      background-color: #b71c1c;
      background-image: radial-gradient(white 15%, transparent 16%), radial-gradient(white 15%, transparent 16%);
      background-size: 6px 6px;
      background-position: 0 0, 3px 3px;
      border: 2px solid white;
      box-sizing: border-box;
    }

    .flying-card { position: fixed; z-index: 999; pointer-events: none; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
    .discard-container { position: relative; width: 80px; height: 80px; margin: 0 auto; }
    .discard-container .poker-card { position: absolute; top: 0; left: 15px; }

    .inspectable { cursor: pointer; border: 2px dashed #fbc02d; padding: 4px; border-radius: 8px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(251, 192, 45, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(251, 192, 45, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 192, 45, 0); } }

    button { padding: 8px 16px; font-size: 14px; font-weight: bold; margin: 3px; cursor: pointer; border-radius: 6px; border: none; background: #fbc02d; color: #111; }
    button:hover { background: #ffd54f; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .quit-btn { background: #e53935; color: white; margin-left: 8px; }

    @media (max-width: 600px) {
      .poker-card { width: 38px; height: 58px; margin: 1px; }
      .poker-card .rank-top { font-size: 10px; top: 1px; left: 2px; }
      .poker-card .center-suit { font-size: 16px; }
      .casino-table { padding: 8px; border-width: 4px; }
      .splash-title { font-size: 28px; }
      button { padding: 7px 12px; font-size: 12px; }
      .tier-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen Animation -->
  <div id="splashScreen" class="splash-overlay">
    <div class="splash-title">KUA MERAH</div>
    <div style="font-size:14px; color:#aaa; margin-top:5px;">Traditional Card Game</div>
    <div class="splash-cards">
      <div class="splash-card red">K♥</div>
      <div class="splash-card">10♠</div>
      <div class="splash-card red">A♦</div>
    </div>
    <div style="font-size:12px; color:#fbc02d;">Shuffling Room Decks...</div>
  </div>

  <!-- Entry / Room Selection Modal -->
  <div id="startModal" class="modal-overlay">
    <div class="modal-box">
      <h2>Welcome Player!</h2>
      <p style="font-size:13px; margin-bottom: 8px;">Enter Your Nickname:</p>
      <input type="text" id="playerNameInput" class="name-input" placeholder="Enter Your Name" value="Player 1" maxlength="15">

      <p style="font-size:13px; margin-bottom: 5px;">Select Room Tier:</p>
      <div class="tier-grid">
        <button class="tier-btn selected" onclick="selectTier(10, this)">$10 Room</button>
        <button class="tier-btn" onclick="selectTier(50, this)">$50 Room</button>
        <button class="tier-btn" onclick="selectTier(100, this)">$100 Room</button>
        <button class="tier-btn" onclick="selectTier(500, this)">$500 Room</button>
        <button class="tier-btn" onclick="selectTier(1000, this)">$1,000 Room</button>
      </div>

      <button onclick="enterGame()" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 16px;">Enter Casino Room</button>
    </div>
  </div>

  <!-- Inspector Modal -->
  <div id="inspectModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 id="inspectTitle">Inspecting Cards</h2>
      <div id="inspectGrid" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 15px 0;"></div>
      <button onclick="closeInspectModal()">Close</button>
    </div>
  </div>

  <h1 style="margin: 2px 0; font-size:24px;">Kua Merah</h1>
  <div>
    <button id="nextRoundBtn" onclick="startGame()" style="display:none;">Start Next Round</button>
    <button id="quitBtn" onclick="quitGame()" class="quit-btn" style="display:none;">Quit & Reset Room</button>
  </div>
  
  <div><span id="actionLog" class="action-banner">Join a room tier to begin.</span></div>
  <h2 id="status" style="margin: 3px 0; font-size: 16px;">Ready</h2>

  <div class="casino-table">
    <div class="table-layout">
      <!-- Top Bot -->
      <div id="player-box-2" class="bot-hand">
        <h3 id="name-2" style="margin:1px; font-size:14px;">Player 3</h3>
        <div id="bal-2" class="balance">$10.00</div>
        <div id="hand-2"></div>
      </div>

      <!-- Middle Row -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div id="player-box-3" class="bot-hand" style="width: 30%;">
          <h3 id="name-3" style="margin:1px; font-size:14px;">Player 4</h3>
          <div id="bal-3" class="balance">$10.00</div>
          <div id="hand-3"></div>
        </div>

        <div style="background: rgba(0,0,0,0.45); padding: 10px; border-radius: 10px; border: 1px solid #fbc02d; display: flex; justify-content: space-around; width: 38%;">
          <div id="deck-area" onclick="inspectCards('deck')">
            <b style="font-size:12px;">Middle Deck</b><br>
            <div id="deck-card" class="poker-card back" style="margin-top:2px;"></div>
            <div style="font-size:11px;"><span id="deck-count" style="color: #fbc02d; font-weight:bold;">52</span> left</div>
            <button id="drawBtn" onclick="event.stopPropagation(); drawCard();" disabled style="margin-top:2px; padding:4px 8px; font-size:11px;">Draw</button>
          </div>

          <div id="discard-area" onclick="inspectCards('discard')">
            <b style="font-size:12px;">Discard Pile</b><br>
            <div class="discard-container" id="discard">
              <span style="line-height:60px; color:#aaa; font-size:11px;">Empty</span>
            </div>
            <button id="takeBtn" onclick="event.stopPropagation(); takeDiscard();" disabled style="margin-top:2px; padding:4px 8px; font-size:11px;">Take</button>
          </div>
        </div>

        <div id="player-box-1" class="bot-hand" style="width: 30%;">
          <h3 id="name-1" style="margin:1px; font-size:14px;">Player 2</h3>
          <div id="bal-1" class="balance">$10.00</div>
          <div id="hand-1"></div>
        </div>
      </div>

      <!-- Human Player -->
      <div id="player-box-0" style="background: rgba(255,255,255,0.08); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);">
        <h3 id="name-0" style="margin:1px; font-size:14px;">You</h3>
        <div id="bal-0" class="balance">$10.00</div>
        <div id="hand-0"></div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentGameState = null;
    let selectedTier = 10;

    setTimeout(() => {
      let splash = document.getElementById('splashScreen');
      splash.style.opacity = '0';
      setTimeout(() => splash.style.display = 'none', 800);
    }, 2000);

    function playCardSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = ctx.sampleRate * 0.04;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 900;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.6, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
      } catch(e) {}
    }

    function triggerCardAnimation(source, targetPlayerIdx) {
      let srcEl = source === 'deck' ? document.getElementById('deck-area') : document.getElementById('discard-area');
      let targetEl = document.getElementById(`player-box-${targetPlayerIdx}`);
      if (!srcEl || !targetEl) return;

      let srcRect = srcEl.getBoundingClientRect();
      let targetRect = targetEl.getBoundingClientRect();

      let flyingCard = document.createElement('div');
      flyingCard.className = 'poker-card back flying-card';
      flyingCard.style.left = `${srcRect.left + 5}px`;
      flyingCard.style.top = `${srcRect.top + 5}px`;

      document.body.appendChild(flyingCard);

      setTimeout(() => {
        flyingCard.style.left = `${targetRect.left + targetRect.width / 2 - 20}px`;
        flyingCard.style.top = `${targetRect.top + targetRect.height / 2 - 30}px`;
        flyingCard.style.opacity = '0.3';
      }, 20);

      setTimeout(() => flyingCard.remove(), 550);
    }

    function selectTier(amount, btn) {
      selectedTier = amount;
      document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function inspectCards(type) {
      if (!currentGameState || !currentGameState.gameEnded) return;

      let modal = document.getElementById('inspectModal');
      let title = document.getElementById('inspectTitle');
      let grid = document.getElementById('inspectGrid');
      grid.innerHTML = '';

      let cardList = (type === 'deck') ? currentGameState.deck : currentGameState.discardPile;
      title.innerText = (type === 'deck') ? `Middle Deck Cards (${cardList.length})` : `Discard Pile (${cardList.length})`;

      if (cardList.length === 0) {
        grid.innerHTML = '<p style="color:#aaa;">No cards in this pile.</p>';
      } else {
        cardList.forEach((c, idx) => {
          setTimeout(() => {
            grid.innerHTML += renderPokerCard(c);
            playCardSound();
          }, idx * 30);
        });
      }

      modal.style.display = 'flex';
    }

    function closeInspectModal() {
      document.getElementById('inspectModal').style.display = 'none';
    }

    function enterGame() {
      let customName = document.getElementById('playerNameInput').value;
      socket.emit('setPlayerName', customName);
      socket.emit('setRoomTier', selectedTier);

      document.getElementById('startModal').style.display = 'none';
      document.getElementById('nextRoundBtn').style.display = 'inline-block';
      document.getElementById('quitBtn').style.display = 'inline-block';
      startGame();
    }

    function quitGame() {
      socket.emit('resetRoom');
      document.getElementById('startModal').style.display = 'flex';
      document.getElementById('nextRoundBtn').style.display = 'none';
      document.getElementById('quitBtn').style.display = 'none';
    }

    function startGame() { socket.emit('startGame'); }
    function drawCard() { socket.emit('playerDraw'); }
    function takeDiscard() { socket.emit('playerTakeDiscard'); }
    function discard(idx) { socket.emit('discardCard', idx); }

    function renderPokerCard(card, isClickable = false, index = 0, customRotation = 0) {
      let colorClass = card.isRed ? 'poker-card red' : 'poker-card';
      let clickAttr = isClickable ? `onclick="discard(${index})"` : '';
      let rotStyle = customRotation !== 0 ? `transform: rotate(${customRotation}deg);` : '';
      return `
        <div class="${colorClass}" ${clickAttr} style="${rotStyle} ${isClickable ? 'cursor:pointer; transform: translateY(-4px); border: 2px solid #fbc02d;' : ''}">
          <div class="rank-top">${card.value}<span>${card.suit}</span></div>
          <div class="center-suit">${card.suit}</div>
        </div>
      `;
    }

    socket.on('cardSound', () => playCardSound());
    socket.on('animateCard', (data) => triggerCardAnimation(data.source, data.targetPlayer));

    socket.on('stateUpdate', (state) => {
      currentGameState = state;
      document.getElementById('status').innerText = state.status;
      document.getElementById('actionLog').innerText = state.actionLog;
      document.getElementById('deck-count').innerText = state.deck.length;

      let deckArea = document.getElementById('deck-area');
      let discardArea = document.getElementById('discard-area');
      if (state.gameEnded) {
        deckArea.classList.add('inspectable');
        discardArea.classList.add('inspectable');
      } else {
        deckArea.classList.remove('inspectable');
        discardArea.classList.remove('inspectable');
      }

      for (let i = 0; i < 4; i++) {
        document.getElementById(`name-${i}`).innerText = state.playerNames[i];
        let b = state.balances[i];
        let sign = b >= 0 ? '$' : '-$';
        document.getElementById(`bal-${i}`).innerText = `Balance: ${sign}${Math.abs(b).toFixed(2)}`;
      }

      let isMyTurn = (state.turn === 0 && !state.gameEnded && !state.isDealing);
      let p1HandLen = state.hands[0].length;
      document.getElementById('drawBtn').disabled = !(isMyTurn && p1HandLen === 7);

      let topDiscard = state.discardPile.length > 0 ? state.discardPile[state.discardPile.length - 1] : null;
      let countInP1Hand = (topDiscard && state.hands[0]) ? state.hands[0].filter(c => c.value === topDiscard.value).length : 0;
      let isCheatingAttempt = countInP1Hand >= 2;

      document.getElementById('takeBtn').disabled = !(isMyTurn && p1HandLen === 7 && state.discardPile.length > 0 && !isCheatingAttempt);

      let p1Div = document.getElementById('hand-0');
      p1Div.innerHTML = '';
      state.hands[0].forEach((c, idx) => {
        p1Div.innerHTML += renderPokerCard(c, isMyTurn && p1HandLen === 8, idx);
      });

      for (let botIdx = 1; botIdx < 4; botIdx++) {
        let botDiv = document.getElementById(`hand-${botIdx}`);
        botDiv.innerHTML = '';

        let shouldReveal = false;
        if (state.revealStage === 2) shouldReveal = true;
        if (state.revealStage === 1 && state.winner === botIdx) shouldReveal = true;

        state.hands[botIdx].forEach(c => {
          if (shouldReveal) {
            botDiv.innerHTML += renderPokerCard(c);
          } else {
            botDiv.innerHTML += `<div class="poker-card back"></div>`;
          }
        });
      }

      let discDiv = document.getElementById('discard');
      if (state.discardPile.length > 0) {
        discDiv.innerHTML = '';
        let recentCards = state.discardPile.slice(-5);
        recentCards.forEach((c) => {
          discDiv.innerHTML += renderPokerCard(c, false, 0, c.rotation || 0);
        });
      } else {
        discDiv.innerHTML = '<span style="line-height:60px; color:#aaa; font-size:11px;">Empty</span>';
      }
    });
  </script>
</body>
</html>
